<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Colour Coded Tajweed Quran</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --green-dark:#1e3d2a;
  --green-mid:#2d5a3d;
  --green-btn:#3a7050;
  --green-sel:#4a8860;
  --green-row:#2a5038;
  --text:rgba(255,255,255,1);
  --text-dim:rgba(255,255,255,0.6);
  --border:rgba(255,255,255,0.12);
  --bnav-h:64px;
}
html,body{height:100%;width:100%;overflow:hidden;background:#1a1a1a;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;}

#app{display:flex;flex-direction:column;height:100%;width:100%;position:fixed;inset:0;}

#viewer{flex:1;position:relative;overflow:hidden;background:#1a1a1a;display:flex;align-items:center;justify-content:center;touch-action:pinch-zoom;}
#img-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transform-origin:center center;will-change:transform;}
#qimg{max-width:100%;max-height:100%;object-fit:contain;display:block;user-select:none;-webkit-user-drag:none;pointer-events:none;image-rendering:-webkit-optimize-contrast;image-rendering:crisp-edges;}
#tap-overlay{position:absolute;inset:0;z-index:5;}

#loading{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(26,26,26,0.92);transition:opacity .25s ease;}
#loading.hide{opacity:0;pointer-events:none;}
.spin{width:36px;height:36px;border:3px solid rgba(255,255,255,.12);border-top-color:rgba(255,255,255,.7);border-radius:50%;animation:spin .75s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.load-lbl{font-size:13px;color:var(--text-dim);}

#bnav{height:var(--bnav-h);background:var(--green-dark);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-around;padding:0 40px;z-index:50;transition:transform .3s ease;flex-shrink:0;}
#bnav.hidden{transform:translateY(100%);}
.nav-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;color:var(--text-dim);font-size:11px;letter-spacing:.02em;background:none;border:none;padding:8px 32px;border-radius:10px;transition:color .15s,background .15s;}
.nav-btn svg{width:26px;height:26px;fill:currentColor;}
.nav-btn:active{background:rgba(255,255,255,.08);color:var(--text);}

/* ── PANELS ── */
.panel{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;background:var(--green-dark);transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);pointer-events:none;overflow:hidden;}
.panel.open{transform:translateY(0);pointer-events:all;}

.pnl-hdr{background:var(--green-mid);padding:16px 16px 0;flex-shrink:0;}
.pnl-title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.pnl-title{font-size:20px;font-weight:600;}
.pnl-close{width:32px;height:32px;background:rgba(255,255,255,.12);border:none;border-radius:50%;color:var(--text);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.pnl-close:active{background:rgba(255,255,255,.22);}

.tab-row{display:flex;}
.tab-btn{flex:1;padding:10px 0;background:none;border:none;color:var(--text-dim);font-size:15px;font-weight:500;cursor:pointer;border-bottom:3px solid transparent;transition:color .15s;}
.tab-btn.on{color:var(--text);border-bottom-color:var(--text);}

/* ── SURAH LIST ── */
#t-surah{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
#t-surah::-webkit-scrollbar{width:3px;}
#t-surah::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:2px;}

.surah-item{display:flex;align-items:center;padding:0 16px;height:64px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .12s;gap:14px;}
.surah-item:active,.surah-item.current{background:var(--green-row);}
.si-num{width:36px;height:36px;border:1.5px solid rgba(255,255,255,.3);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0;}
.si-body{flex:1;min-width:0;}
.si-en{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.si-sub{font-size:12px;color:var(--text-dim);margin-top:2px;}
.si-pg{font-size:13px;color:var(--text-dim);flex-shrink:0;}

/* ── JUZ PANEL — two column layout ── */
#juz-wrap{display:flex;flex:1;min-height:0;}

/* Left column — juz list */
#juz-list{
  width:55%;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  border-right:1px solid var(--border);
  flex-shrink:0;
}
#juz-list::-webkit-scrollbar{width:3px;}
#juz-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:2px;}

.juz-item{
  display:flex;flex-direction:column;justify-content:center;
  padding:14px 16px;
  cursor:pointer;border-bottom:1px solid var(--border);
  transition:background .12s;min-height:60px;
}
.juz-item:active{background:var(--green-row);}
.juz-item.selected{background:var(--green-sel);}
.ji-top{display:flex;align-items:center;justify-content:space-between;}
.ji-name{font-size:15px;font-weight:700;}
.ji-arrow{font-size:13px;color:var(--text-dim);}
.ji-sub{font-size:11px;color:var(--text-dim);margin-top:3px;}

/* Right column — page list for selected juz */
#juz-pages{
  flex:1;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  background:var(--green-dark);
}
#juz-pages::-webkit-scrollbar{width:3px;}
#juz-pages::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:2px;}

/* Header for juz pages column */
.jp-header{
  position:sticky;top:0;z-index:2;
  background:var(--green-mid);
  padding:10px 14px;
  border-bottom:1px solid var(--border);
  display:flex;flex-direction:column;gap:2px;
}
.jp-header-name{font-size:14px;font-weight:700;}
.jp-header-sub{font-size:11px;color:var(--text-dim);}

.jp-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 14px;
  cursor:pointer;border-bottom:1px solid var(--border);
  transition:background .12s;
}
.jp-item:active{background:var(--green-row);}
.jp-item.current-pg{background:var(--green-sel);}
.jp-num{font-size:15px;font-weight:600;}
.jp-surah{font-size:11px;color:var(--text-dim);margin-top:2px;}
.jp-arrow{font-size:13px;color:var(--text-dim);}

/* placeholder when no juz selected */
.jp-placeholder{
  display:flex;align-items:center;justify-content:center;
  height:100%;padding:40px 16px;
  text-align:center;font-size:13px;color:var(--text-dim);line-height:1.6;
}

/* ── BOOKMARKS ── */
#t-bk{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
#t-bk::-webkit-scrollbar{width:3px;}
#t-bk::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:2px;}

.add-bk-btn{margin:12px 16px;width:calc(100% - 32px);background:var(--green-btn);border:none;border-radius:10px;color:#fff;font-size:15px;font-weight:600;padding:14px;cursor:pointer;display:block;}
.add-bk-btn:active{background:var(--green-sel);}
.bk-item{display:flex;align-items:center;padding:0 16px;height:64px;cursor:pointer;border-bottom:1px solid var(--border);gap:14px;transition:background .12s;}
.bk-item:active{background:var(--green-row);}
.bk-body{flex:1;min-width:0;}
.bk-name{font-size:15px;font-weight:600;}
.bk-date{font-size:12px;color:var(--text-dim);margin-top:2px;}
.bk-del{width:32px;height:32px;flex-shrink:0;background:rgba(220,50,50,.15);border:1px solid rgba(220,50,50,.3);border-radius:8px;color:#ff6b6b;font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.bk-empty{padding:48px 24px;text-align:center;font-size:14px;color:var(--text-dim);line-height:1.6;}

/* ── INDICATOR ── */
#pg-indicator{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);z-index:6;background:rgba(0,0,0,.6);color:rgba(255,255,255,.9);font-size:12px;padding:5px 14px;border-radius:12px;pointer-events:none;opacity:0;transition:opacity .3s;white-space:nowrap;}
#pg-indicator.show{opacity:1;}

#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(6px);background:rgba(30,61,42,.97);border:1px solid rgba(255,255,255,.15);color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;z-index:9000;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.4);}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

@keyframes pgFade{from{opacity:0;}to{opacity:1;}}
.pg-anim{animation:pgFade .18s ease;}
</style>
</head>

<div class="panel" id="pnav">

      <div id="juz-pages"><div class="jp-placeholder">Select a Juz to see its pages</div></div>
    </div>
  </div>
</div>

<!-- BOOKMARKS PANEL -->
<div class="panel" id="pbk" style="display:flex;flex-direction:column;">

    <div class="pnl-title-row">
      <div class="pnl-title">Bookmarks</div>

    </div>
    <div class="tab-row">
      <button class="tab-btn on">Page</button>
    </div>
  </div>
  <div id="t-bk">
    <button class="add-bk-btn" onclick="addBookmark()">+ Bookmark Current Page</button>
    <div id="bk-list"></div>
  </div>
</div>

<div id="toast"></div>

let curPage = parseInt(localStorage.getItem('qpg')||'4');
let bookmarks = JSON.parse(localStorage.getItem('qtbk')||'[]');
let menuVisible = true;
let preloaded = {};
let selectedJuz = null;

// ── PAGE LOADING ──────────────────────────────────
function loadPage(n) {
  n = Math.max(1, Math.min(TOTAL, n));
  curPage = n;
  localStorage.setItem('qpg', n);

  const img = document.getElementById('qimg');
  const loader = document.getElementById('loading');
  loader.classList.remove('hide');

  if(preloaded[n]) {
    img.src = pageUrl(n);
    img.className = 'pg-anim';
    loader.classList.add('hide');
    showIndicator(n);
    preloadAdjacent(n);
    return;
  }

  const tmp = new Image();
  tmp.onload = () => {
    img.src = pageUrl(n);
    img.className = 'pg-anim';
    loader.classList.add('hide');
    preloaded[n] = true;
    showIndicator(n);
    preloadAdjacent(n);
  };
  tmp.onerror = () => loader.classList.add('hide');
  tmp.src = pageUrl(n);
}

function preloadAdjacent(n) {
  [n+1, n-1, n+2].forEach(p => {
    if(p >= 1 && p <= TOTAL && !preloaded[p]) {
      const t = new Image();
      t.onload = () => preloaded[p] = true;
      t.src = pageUrl(p);
    }
  });
}

function showIndicator(n) {
  const s = getSurah(n), j = getJuz(n);
  const el = document.getElementById('pg-indicator');
  el.textContent = `${s.en}  ·  Page ${n}  ·  ${j.name}`;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2000);
}

// ── PINCH TO ZOOM ─────────────────────────────────
const viewer = document.getElementById('viewer');
const wrap   = document.getElementById('img-wrap');
const tapOverlay = document.getElementById('tap-overlay');
let sc=1, tx=0, ty=0, startDist=0, startSc=1, panOX=0, panOY=0, isPinching=false;
let swipeStartX=0, swipeStartY=0;

function applyT() { wrap.style.transform = `translate(${tx}px,${ty}px) scale(${sc})`; }
function resetT() {
  sc=1; tx=0; ty=0;
  wrap.style.transition = 'transform .25s ease';
  applyT();
  setTimeout(() => wrap.style.transition='', 260);
}

viewer.addEventListener('touchstart', e => {
  if(e.touches.length === 2) {
    isPinching = true;
    startDist = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
    startSc = sc;
    e.preventDefault();
  } else if(e.touches.length === 1) {
    panOX = e.touches[0].clientX - tx;
    panOY = e.touches[0].clientY - ty;
  }
}, {passive:false});

viewer.addEventListener('touchmove', e => {
  if(e.touches.length === 2 && isPinching) {
    e.preventDefault();
    const d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
    sc = Math.min(5, Math.max(1, startSc*(d/startDist)));
    if(sc <= 1) { tx=0; ty=0; }
    wrap.style.transition = '';
    applyT();
  } else if(e.touches.length === 1 && sc > 1.05) {
    e.preventDefault();
    tx = e.touches[0].clientX - panOX;
    ty = e.touches[0].clientY - panOY;
    wrap.style.transition = '';
    applyT();
  }
}, {passive:false});

viewer.addEventListener('touchend', e => {
  if(e.touches.length === 0) { isPinching = false; if(sc < 1.05) resetT(); }
}, {passive:true});

tapOverlay.addEventListener('touchstart', e => {
  swipeStartX = e.touches[0].clientX;
  swipeStartY = e.touches[0].clientY;
}, {passive:true});

tapOverlay.addEventListener('touchend', e => {
  if(sc > 1.05) return;
  const dx = e.changedTouches[0].clientX - swipeStartX;
  const dy = e.changedTouches[0].clientY - swipeStartY;
  if(Math.sqrt(dx*dx+dy*dy) < 12) {
    menuVisible = !menuVisible;
    document.getElementById('bnav').classList.toggle('hidden', !menuVisible);
    return;
  }
  if(Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 40) {
    // RTL: swipe left→right = forward (higher page), right→left = back
    loadPage(curPage + (dx > 0 ? 1 : -1));
  }
}, {passive:true});

// ── PANELS ────────────────────────────────────────
function openPanel(id) {
  menuVisible = true;
  document.getElementById('bnav').classList.remove('hidden');
  if(id === 'pnav') {
    swNavTab('surah');
  }
  if(id === 'pbk') renderBookmarks();
  document.getElementById(id).classList.add('open');
}

function closePanel(id) {
  document.getElementById(id).classList.remove('open');
}

// ── NAV TABS ──────────────────────────────────────
function swNavTab(tab) {
  document.getElementById('tab-surah-btn').classList.toggle('on', tab==='surah');
  document.getElementById('tab-juz-btn').classList.toggle('on',   tab==='juz');
  document.getElementById('t-surah').style.display = tab==='surah' ? '' : 'none';
  document.getElementById('t-juz').style.display   = tab==='juz'   ? '' : 'none';

  if(tab === 'surah') {
    setTimeout(() => {
      if(selectedJuz) {
        // scroll to first surah in selected juz
        const juz = JUZS[selectedJuz-1];
        scrollToCurrentSurah(juz.pg);
      } else {
        scrollToCurrentSurah();
      }
    }, 60);
  }
  if(tab === 'juz') {
    // If a juz was previously selected, keep it; otherwise select current juz
    if(!selectedJuz) selectJuz(getJuz(curPage).n);
    // Scroll juz list to current juz
    setTimeout(() => scrollToCurrentJuz(), 60);
  }
}

// ── SURAH LIST ────────────────────────────────────
function buildSurahList() {
  document.getElementById('t-surah').innerHTML = SURAHS.map(s => `
    <div class="surah-item" id="si-${s.n}" onclick="loadPage(${s.pg});closePanel('pnav')">
      <div class="si-num">${s.n}</div>
      <div class="si-body">
        <div class="si-en">${String(s.n).padStart(2,'0')}. ${s.en}</div>
        <div class="si-sub">${s.sub}</div>
      </div>
      <div class="si-pg">${s.pg}</div>
    </div>`).join('');
}

function scrollToCurrentSurah(targetPage) {
  const pg = targetPage || curPage;
  const s = getSurah(pg);
  // Remove highlight from all, add to current
  document.querySelectorAll('.surah-item').forEach(el => el.classList.remove('current'));
  const el = document.getElementById('si-'+s.n);
  if(el) {
    el.classList.add('current');
    el.scrollIntoView({block:'center', behavior:'smooth'});
  }
}

// ── JUZ LIST ──────────────────────────────────────
function buildJuzList() {
  document.getElementById('juz-list').innerHTML = JUZS.map(j => `
    <div class="juz-item" id="ji-${j.n}" onclick="selectJuz(${j.n})">
      <div class="ji-top">
        <span class="ji-name">${j.name}</span>
        <span class="ji-arrow">›</span>
      </div>
      <div class="ji-sub">${j.sub}</div>
    </div>`).join('');
}

function selectJuz(juzN) {
  selectedJuz = juzN;

  // Highlight selected juz
  document.querySelectorAll('.juz-item').forEach(el => el.classList.remove('selected'));
  const jel = document.getElementById('ji-'+juzN);
  if(jel) { jel.classList.add('selected'); jel.scrollIntoView({block:'nearest', behavior:'smooth'}); }

  const juz = JUZS[juzN-1];
  const nextJuz = JUZS[juzN] || null;
  const juzEnd = nextJuz ? nextJuz.pg - 1 : TOTAL;
  const pageCount = juzEnd - juz.pg + 1;

  // Build page list for this juz
  let html = `<div class="jp-header"><div class="jp-header-name">${juz.name}</div><div class="jp-header-sub">${pageCount} pages · starts p.${juz.pg}</div></div>`;

  for(let i = 0; i < pageCount; i++) {
    const absPage = juz.pg + i;
    const isCur = absPage === curPage;
    const surah = getSurah(absPage);
    html += `<div class="jp-item${isCur?' current-pg':''}" onclick="loadPage(${absPage});closePanel('pnav')">
      <div>
        <div class="jp-num">Page ${i+1}</div>
        <div class="jp-surah">${surah.en} · p.${absPage}</div>
      </div>
      <div class="jp-arrow">›</div>
    </div>`;
  }

  const jpEl = document.getElementById('juz-pages');
  jpEl.innerHTML = html;

  // Scroll page list to current page if it's in this juz
  if(curPage >= juz.pg && curPage <= juzEnd) {
    setTimeout(() => {
      const idx = curPage - juz.pg;
      const items = jpEl.querySelectorAll('.jp-item');
      if(items[idx]) items[idx].scrollIntoView({block:'center', behavior:'smooth'});
    }, 60);
  }
}

function scrollToCurrentJuz() {
  const j = getJuz(curPage);
  const el = document.getElementById('ji-'+j.n);
  if(el) el.scrollIntoView({block:'center', behavior:'smooth'});
}

// When user selects a juz then taps Surah tab — scroll to first surah in that juz
function handleSurahTabFromJuz() {
  if(selectedJuz) {
    const juz = JUZS[selectedJuz-1];
    scrollToCurrentSurah(juz.pg);
  } else {
    scrollToCurrentSurah();
  }
}

// Override swNavTab surah case to use juz-aware scroll
const _origSwNavTab = swNavTab;

// ── HELPERS ───────────────────────────────────────
function getSurah(p) {
  let s = SURAHS[0];
  for(let i=SURAHS.length-1;i>=0;i--) { if(SURAHS[i].pg<=p){s=SURAHS[i];break;} }
  return s;
}
function getJuz(p) {
  let j = JUZS[0];
  for(let i=JUZS.length-1;i>=0;i--) { if(JUZS[i].pg<=p){j=JUZS[i];break;} }
  return j;
}

// ── BOOKMARKS ─────────────────────────────────────
function addBookmark() {
  if(bookmarks.find(b=>b.pg===curPage)) { showToast('Page '+curPage+' already bookmarked'); return; }
  const s=getSurah(curPage), j=getJuz(curPage);
  bookmarks.unshift({pg:curPage, name:`${s.en}  ·  Page ${curPage}`, juz:j.name, date:Date.now()});
  localStorage.setItem('qtbk', JSON.stringify(bookmarks));
  showToast('Bookmarked: Page '+curPage);
}

function renderBookmarks() {
  const el = document.getElementById('bk-list');
  if(!bookmarks.length) {
    el.innerHTML='<div class="bk-empty">No bookmarks yet.<br>Tap the Bookmark button to save the current page.</div>';
    return;
  }
  el.innerHTML = bookmarks.map((b,i) => `
    <div class="bk-item">
      <div style="font-size:22px;flex-shrink:0">🔖</div>
      <div class="bk-body" onclick="loadPage(${b.pg});closePanel('pbk')">
        <div class="bk-name">${b.name}</div>
        <div class="bk-date">${b.juz}  ·  ${new Date(b.date).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}</div>
      </div>
      <div class="bk-del" onclick="delBk(${i},event)">✕</div>
    </div>`).join('');
}

function delBk(i,e) {
  e.stopPropagation();
  bookmarks.splice(i,1);
  localStorage.setItem('qtbk',JSON.stringify(bookmarks));
  renderBookmarks();
  showToast('Bookmark removed');
}

// ── TOAST ─────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2500);
}

// ── KEYBOARD ──────────────────────────────────────
document.addEventListener('keydown', e => {
  if(e.key==='ArrowLeft'||e.key==='ArrowDown')  loadPage(curPage+1);
  if(e.key==='ArrowRight'||e.key==='ArrowUp')   loadPage(curPage-1);
});

// ── INIT ──────────────────────────────────────────
window.addEventListener('load', () => {
  buildSurahList();
  buildJuzList();
  loadPage(curPage);
});
</script>
