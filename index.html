<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2d5a3d">
<link rel="manifest" href="manifest.json">
<title>Colour Coded Tajweed Quran</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}

:root{
  --green-dark:#1e3d2a;
  --green-mid:#2d5a3d;
  --green-btn:#3a7050;
  --green-sel:#4a8860;
  --green-row:#2a5038;
  --white:#ffffff;
  --off-white:#f5f5f5;
  --text:#ffffff;
  --text-dim:rgba(255,255,255,0.65);
  --text-dark:#1a1a1a;
  --border:rgba(255,255,255,0.12);
  --border-dark:rgba(0,0,0,0.1);
  --bnav-h:64px;
}

html,body{
  height:100%;width:100%;
  overflow:hidden;
  background:var(--green-dark);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased;
}

/* ── APP SHELL ── */
#app{
  display:flex;flex-direction:column;
  height:100%;width:100%;
  position:fixed;inset:0;
}

/* ── PAGE VIEWER ── */
#viewer{
  flex:1;
  position:relative;
  overflow:hidden;
  background:#1a1a1a;
  display:flex;align-items:center;justify-content:center;
  touch-action:pinch-zoom;
}

#img-wrap{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  transform-origin:center center;
  will-change:transform;
}

#qimg{
  max-width:100%;max-height:100%;
  object-fit:contain;
  display:block;
  user-select:none;
  -webkit-user-drag:none;
  pointer-events:none;
  /* crisp rendering for Arabic text */
  image-rendering:-webkit-optimize-contrast;
  image-rendering:crisp-edges;
}

/* tap overlay — invisible, sits over image to catch taps */
#tap-overlay{
  position:absolute;inset:0;
  z-index:5;
}

/* ── LOADING ── */
#loading{
  position:absolute;inset:0;z-index:20;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  background:rgba(26,26,26,0.9);
  transition:opacity .25s ease;
}
#loading.hide{opacity:0;pointer-events:none;}
.spin{
  width:36px;height:36px;
  border:3px solid rgba(255,255,255,.15);
  border-top-color:rgba(255,255,255,.7);
  border-radius:50%;
  animation:spin .75s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
.load-lbl{font-size:13px;color:rgba(255,255,255,.5);}

/* ── BOTTOM NAV ── */
#bnav{
  flex-shrink:0;
  height:var(--bnav-h);
  background:var(--green-dark);
  border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-around;
  padding:0 40px;
  z-index:50;
  transition:transform .3s ease;
}
#bnav.hidden{transform:translateY(100%);}

.nav-btn{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;cursor:pointer;
  color:var(--text-dim);
  font-size:11px;letter-spacing:.02em;
  background:none;border:none;
  padding:8px 24px;
  border-radius:10px;
  transition:color .15s,background .15s;
  -webkit-tap-highlight-color:transparent;
}
.nav-btn svg{width:26px;height:26px;fill:currentColor;}
.nav-btn:active{background:rgba(255,255,255,.08);color:var(--text);}

/* ── PANELS (slide up from bottom) ── */
.panel{
  position:fixed;inset:0;z-index:100;
  display:flex;flex-direction:column;
  background:var(--green-dark);
  transform:translateY(100%);
  transition:transform .3s cubic-bezier(.4,0,.2,1);
  pointer-events:none;
}
.panel.open{transform:translateY(0);pointer-events:all;}

/* Panel header — matches reference app exactly */
.pnl-hdr{
  background:var(--green-mid);
  padding:16px 16px 0;
  flex-shrink:0;
}
.pnl-title-row{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:14px;
}
.pnl-title{
  font-size:20px;font-weight:600;
  color:var(--text);
  /* Arabic title shown when relevant */
}
.pnl-ar{
  font-size:22px;color:var(--text);
  font-family:serif;
}
.pnl-close{
  width:32px;height:32px;
  background:rgba(255,255,255,.12);
  border:none;border-radius:50%;
  color:var(--text);font-size:18px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
}
.pnl-close:active{background:rgba(255,255,255,.22);}

/* Tab row inside panel header */
.tab-row{
  display:flex;gap:0;
  border-bottom:none;
}
.tab-btn{
  flex:1;padding:10px 0;
  background:none;border:none;
  color:var(--text-dim);font-size:15px;font-weight:500;
  cursor:pointer;position:relative;
  transition:color .15s;
  border-bottom:3px solid transparent;
}
.tab-btn.on{
  color:var(--text);
  border-bottom-color:var(--text);
}

/* Panel scroll body */
.pnl-body{
  flex:1;overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}
.pnl-body::-webkit-scrollbar{width:3px;}
.pnl-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:2px;}

/* ── SURAH LIST ── */
.surah-item{
  display:flex;align-items:center;
  padding:0 16px;
  height:64px;
  cursor:pointer;
  border-bottom:1px solid var(--border);
  transition:background .12s;
  gap:14px;
}
.surah-item:active{background:var(--green-row);}
.si-num{
  width:36px;height:36px;
  border:1.5px solid rgba(255,255,255,.3);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:600;
  color:var(--text);flex-shrink:0;
}
.si-body{flex:1;min-width:0;}
.si-en{
  font-size:16px;font-weight:600;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.si-sub{font-size:12px;color:var(--text-dim);margin-top:2px;}
.si-pg{font-size:13px;color:var(--text-dim);flex-shrink:0;}

/* ── JUZ LIST ── */
.juz-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;height:60px;
  cursor:pointer;border-bottom:1px solid var(--border);
  transition:background .12s;
}
.juz-item:active{background:var(--green-row);}
/* highlighted current juz */
.juz-item.current{background:var(--green-sel);}
.ji-left{display:flex;flex-direction:column;}
.ji-name{font-size:15px;font-weight:600;color:var(--text);}
.ji-sub{font-size:12px;color:var(--text-dim);margin-top:2px;}
.ji-pg{font-size:14px;font-weight:600;color:var(--text-dim);}

/* ── BOOKMARKS ── */
.bk-empty{
  padding:48px 24px;text-align:center;
  font-size:14px;color:var(--text-dim);line-height:1.6;
}
.bk-item{
  display:flex;align-items:center;
  padding:0 16px;height:64px;
  cursor:pointer;border-bottom:1px solid var(--border);
  gap:14px;transition:background .12s;
}
.bk-item:active{background:var(--green-row);}
.bk-icon{font-size:22px;flex-shrink:0;}
.bk-body{flex:1;min-width:0;}
.bk-name{font-size:15px;font-weight:600;color:var(--text);}
.bk-date{font-size:12px;color:var(--text-dim);margin-top:2px;}
.bk-del{
  width:32px;height:32px;flex-shrink:0;
  background:rgba(220,50,50,.15);
  border:1px solid rgba(220,50,50,.3);
  border-radius:8px;color:#ff6b6b;font-size:16px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
}

/* PAGE tab inside bookmarks — current page button */
.add-bk-btn{
  margin:12px 16px;
  width:calc(100% - 32px);
  background:var(--green-btn);
  border:none;border-radius:10px;
  color:var(--text);font-size:15px;font-weight:600;
  padding:14px;cursor:pointer;
  transition:background .15s;
}
.add-bk-btn:active{background:var(--green-sel);}

/* ── PAGE NUMBER INDICATOR ── */
#pg-indicator{
  position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
  z-index:6;
  background:rgba(0,0,0,.55);
  color:rgba(255,255,255,.85);
  font-size:12px;padding:4px 12px;border-radius:12px;
  pointer-events:none;
  opacity:0;transition:opacity .3s;
  white-space:nowrap;
}
#pg-indicator.show{opacity:1;}

/* ── TOAST ── */
#toast{
  position:fixed;bottom:80px;left:50%;
  transform:translateX(-50%) translateY(6px);
  background:rgba(30,61,42,.95);
  border:1px solid rgba(255,255,255,.15);
  color:var(--text);
  padding:10px 20px;border-radius:20px;
  font-size:13px;z-index:9000;
  opacity:0;pointer-events:none;
  transition:opacity .25s,transform .25s;
  white-space:nowrap;
  box-shadow:0 4px 20px rgba(0,0,0,.4);
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── PAGE TRANSITIONS ── */
@keyframes pgFade{from{opacity:0;}to{opacity:1;}}
.pg-anim{animation:pgFade .2s ease;}

/* ── LANDSCAPE ── */
@media (orientation:landscape){
  #viewer{
    /* fill the full height minus bottom nav */
  }
  #qimg{
    max-height:calc(100vh - var(--bnav-h));
  }
}
</style>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js');
  });
}
</script></head>
<body>
<div id="app">

  <!-- PAGE VIEWER -->
  <div id="viewer">
    <div id="img-wrap">
      <img id="qimg" src="" alt="" draggable="false">
    </div>
    <div id="tap-overlay"></div>
    <div id="loading">
      <div class="spin"></div>
      <div class="load-lbl" id="load-lbl">Loading…</div>
    </div>
    <div id="pg-indicator"></div>
  </div>

  <!-- BOTTOM NAV -->
  <div id="bnav">
    <button class="nav-btn" onclick="openPanel('pnav')">
      <!-- compass/navigate icon -->
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13l-4 8 8-4-4-4z"/></svg>
      Go To
    </button>
    <button class="nav-btn" onclick="addBookmark()">
      <!-- bookmark icon -->
      <svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>
      Bookmark
    </button>

</div>

<!-- NAVIGATE PANEL -->
<div class="panel" id="pnav">
  <div class="pnl-hdr">

      <button class="tab-btn on" onclick="swTab(this,'t-surah')">Surah</button>

  <div class="pnl-body">

        <div style="display:flex;gap:8px;">
          <input id="inp-pg" type="number" min="1" max="851" placeholder="1 – 851"
            style="flex:1;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:12px;font-size:16px;color:#fff;outline:none;">
          <button onclick="jumpPage()" style="background:var(--green-btn);border:none;border-radius:8px;padding:12px 20px;font-size:15px;font-weight:700;color:#fff;cursor:pointer;">Go</button>
        </div>
      </div>
      <div style="margin-bottom:20px;">
        <div style="font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;">Go to Surah Number</div>
        <div style="display:flex;gap:8px;">
          <input id="inp-su" type="number" min="1" max="114" placeholder="1 – 114"
            style="flex:1;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:12px;font-size:16px;color:#fff;outline:none;">
          <button onclick="jumpSurah()" style="background:var(--green-btn);border:none;border-radius:8px;padding:12px 20px;font-size:15px;font-weight:700;color:#fff;cursor:pointer;">Go</button>
        </div>
      </div>
      <div>
        <div style="font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;">Go to Juz Number</div>
        <div style="display:flex;gap:8px;">
          <input id="inp-jz" type="number" min="1" max="30" placeholder="1 – 30"
            style="flex:1;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:12px;font-size:16px;color:#fff;outline:none;">
          <button onclick="jumpJuz()" style="background:var(--green-btn);border:none;border-radius:8px;padding:12px 20px;font-size:15px;font-weight:700;color:#fff;cursor:pointer;">Go</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- BOOKMARKS PANEL -->
<div class="panel" id="pbk">
  <div class="pnl-hdr">
    <div class="pnl-title-row">
      <div class="pnl-title">Bookmarks</div>
      <button class="pnl-close" onclick="closePanel('pbk')">✕</button>
    </div>
    <div class="tab-row">
      <button class="tab-btn on" onclick="">Page</button>
    </div>
  </div>
  <div class="pnl-body">
    <button class="add-bk-btn" onclick="addBookmark()">+ Bookmark Current Page</button>
    <div id="bk-list"></div>
  </div>
</div>

<div id="toast"></div>

<script>
// ═══════════════════════════════════════════
// IMAGE SOURCE
// Your GitHub Pages repo + folder structure
// Folders: "Pages 1-40", "Pages 41-80", etc.
// Files inside each folder: 0.png, 1.png, 2.png...
// Total: 851 pages (right-to-left — page 1 of Quran = last image in PDF)
// ═══════════════════════════════════════════

const REPO = 'https://anonymous1375.github.io/Holy-Quran-Pages';
const TOTAL = 851;

// Build folder map — each folder covers ~28-30 pages
// We'll define exact ranges to match your folder names precisely
// Pattern: "Pages 1-40", "Pages 41-80"... adjust last folder to 851
const FOLDERS = [];
(function(){
  let start = 1;
  const size = 30;
  while(start <= TOTAL){
    const end = Math.min(start + size - 1, TOTAL);
    FOLDERS.push({start, end, name:`Pages ${start}-${end}`});
    start = end + 1;
  }
})();

// Given a Quran page number (1 = Al-Fatiha), return the image URL
// The PDF is left-to-right but Quran is right-to-left
// So Quran page 1 = PDF page TOTAL (851), page 2 = PDF page 850, etc.
// UNLESS your folders are already in Quran order (page 1 = first image)
// Based on your description "pages are in order" — we treat them as Quran order
function pageUrl(quranPage) {
  // Find which folder this page is in
  const folder = FOLDERS.find(f => quranPage >= f.start && quranPage <= f.end);
  if(!folder) return '';
  // File index within folder (0-based)
  const fileIndex = quranPage - folder.start;
  return `${REPO}/${encodeURIComponent(folder.name)}/${fileIndex}.png`;
}

let curPage = parseInt(localStorage.getItem('qpg')||'1');
let bookmarks = JSON.parse(localStorage.getItem('qtbk')||'[]');
let menuVisible = true;
let preloaded = {};

// ═══════════════════════════════════════════
// PAGE LOADING
// ═══════════════════════════════════════════
function loadPage(n, dir=0) {
  n = Math.max(1, Math.min(TOTAL, n));
  curPage = n;
  localStorage.setItem('qpg', n);

  const img = document.getElementById('qimg');
  const loader = document.getElementById('loading');
  const lbl = document.getElementById('load-lbl');

  loader.classList.remove('hide');
  lbl.textContent = `Page ${n}…`;

  const url = pageUrl(n);

  if(preloaded[n]) {
    img.src = url;
    img.className = 'pg-anim';
    loader.classList.add('hide');
    showPageIndicator(n);
    preloadAdjacent(n);
    return;
  }

  const tmp = new Image();
  tmp.onload = () => {
    img.src = url;
    img.className = 'pg-anim';
    loader.classList.add('hide');
    preloaded[n] = true;
    showPageIndicator(n);
    preloadAdjacent(n);
  };
  tmp.onerror = () => {
    loader.classList.add('hide');
    lbl.textContent = 'Failed to load';
    showToast('Could not load page ' + n + ' — check connection');
  };
  tmp.src = url;
}

function preloadAdjacent(n) {
  [n-1, n+1, n+2].forEach(p => {
    if(p >= 1 && p <= TOTAL && !preloaded[p]) {
      const t = new Image();
      t.onload = () => preloaded[p] = true;
      t.src = pageUrl(p);
    }
  });
}

function showPageIndicator(n) {
  const el = document.getElementById('pg-indicator');
  const s = getSurah(n);
  const j = getJuz(n);
  el.textContent = `${s.en}  ·  Page ${n}  ·  ${j.name}`;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2000);
}

// ═══════════════════════════════════════════
// PINCH TO ZOOM (no double tap, no tap-to-select)
// ═══════════════════════════════════════════
const wrap = document.getElementById('img-wrap');
const tapOverlay = document.getElementById('tap-overlay');
let sc=1, tx=0, ty=0, startDist=0, startSc=1, panX=0, panY=0, lastX=0, lastY=0;
let isPinching=false, isPanning=false;
let swipeStartX=0, swipeStartY=0;

function applyT() {
  wrap.style.transform = `translate(${tx}px,${ty}px) scale(${sc})`;
}
function resetT(smooth=true) {
  sc=1; tx=0; ty=0;
  if(smooth) {
    wrap.style.transition = 'transform .25s ease';
    applyT();
    setTimeout(() => wrap.style.transition='', 260);
  } else {
    wrap.style.transition = '';
    applyT();
  }
}

const viewer = document.getElementById('viewer');

viewer.addEventListener('touchstart', e => {
  if(e.touches.length === 2) {
    isPinching = true;
    isPanning = false;
    startDist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    startSc = sc;
    e.preventDefault();
  } else if(e.touches.length === 1) {
    swipeStartX = e.touches[0].clientX;
    swipeStartY = e.touches[0].clientY;
    lastX = e.touches[0].clientX - tx;
    lastY = e.touches[0].clientY - ty;
    isPanning = sc > 1.05;
  }
}, {passive: false});

viewer.addEventListener('touchmove', e => {
  if(e.touches.length === 2 && isPinching) {
    e.preventDefault();
    const dist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    sc = Math.min(5, Math.max(1, startSc * (dist / startDist)));
    if(sc <= 1) { tx=0; ty=0; }
    wrap.style.transition = '';
    applyT();
  } else if(e.touches.length === 1 && isPanning) {
    e.preventDefault();
    tx = e.touches[0].clientX - lastX;
    ty = e.touches[0].clientY - lastY;
    wrap.style.transition = '';
    applyT();
  }
}, {passive: false});

viewer.addEventListener('touchend', e => {
  if(e.touches.length === 0) {
    isPinching = false;
    if(sc < 1.05) resetT(true);
    isPanning = sc > 1.05;
  }
}, {passive: true});

// tap overlay — toggle menu & handle swipe
tapOverlay.addEventListener('touchstart', e => {
  swipeStartX = e.touches[0].clientX;
  swipeStartY = e.touches[0].clientY;
}, {passive: true});

tapOverlay.addEventListener('touchend', e => {
  if(sc > 1.05) return; // don't swipe when zoomed
  const dx = e.changedTouches[0].clientX - swipeStartX;
  const dy = e.changedTouches[0].clientY - swipeStartY;
  const dist = Math.sqrt(dx*dx + dy*dy);

  if(dist < 12) {
    // it's a tap — toggle menu
    toggleMenu();
    return;
  }

  if(Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 40) {
    // horizontal swipe — right-to-left reading
    // swipe RIGHT (dx > 0) = previous page (going backwards in Quran)
    // swipe LEFT (dx < 0) = next page (going forward in Quran)
    loadPage(curPage + (dx < 0 ? 1 : -1));
  }
}, {passive: true});

// ═══════════════════════════════════════════
function toggleMenu() {
  menuVisible = !menuVisible;
  document.getElementById('bnav').classList.toggle('hidden', !menuVisible);
}

function showMenu() {
  menuVisible = true;
  document.getElementById('bnav').classList.remove('hidden');
}

// PANELS
// ═══════════════════════════════════════════
function openPanel(id) {
  showMenu();
  document.getElementById(id).classList.add('open');
  if(id === 'pbk') renderBookmarks();
}
function closePanel(id) {
  document.getElementById(id).classList.remove('open');
}

// ═══════════════════════════════════════════
// TABS
// ═══════════════════════════════════════════
function swTab(btn, tid) {
  // reset all tabs in same panel
  btn.closest('.pnl-hdr').querySelectorAll('.tab-btn').forEach(t => t.classList.remove('on'));
  btn.classList.add('on');
  // hide all tab content in same panel
  const panel = btn.closest('.panel');
  panel.querySelectorAll('.pnl-body > div').forEach(d => d.style.display='none');
  document.getElementById(tid).style.display = '';
}

function jumpPage() {

  else showToast('Enter 1–' + TOTAL);
}
function jumpSurah() {
  const v = parseInt(document.getElementById('inp-su').value);
  if(v >= 1 && v <= 114) { goTo(SURAHS[v-1].pg); closePanel('pnav'); }
  else showToast('Enter 1–114');
}
function jumpJuz() {
  const v = parseInt(document.getElementById('inp-jz').value);
  if(v >= 1 && v <= 30) { goTo(JUZS[v-1].pg); closePanel('pnav'); }
  else showToast('Enter 1–30');
}

function goTo(n) { loadPage(n); }

// ═══════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════
function getSurah(p) {
  let s = SURAHS[0];
  for(let i = SURAHS.length-1; i >= 0; i--) {
    if(SURAHS[i].pg <= p) { s = SURAHS[i]; break; }
  }
  return s;
}
function getJuz(p) {
  let j = JUZS[0];
  for(let i = JUZS.length-1; i >= 0; i--) {
    if(JUZS[i].pg <= p) { j = JUZS[i]; break; }
  }
  return j;
}

// ═══════════════════════════════════════════
// BOOKMARKS
// ═══════════════════════════════════════════
function addBookmark() {
  if(bookmarks.find(b => b.pg === curPage)) {
    showToast('Page ' + curPage + ' already bookmarked');
    return;
  }
  const s = getSurah(curPage);
  const j = getJuz(curPage);
  const name = `${s.en}  ·  Page ${curPage}`;
  bookmarks.unshift({pg: curPage, name, juz: j.name, date: Date.now()});
  localStorage.setItem('qtbk', JSON.stringify(bookmarks));
  showToast('Bookmarked: Page ' + curPage);
}

function renderBookmarks() {
  const el = document.getElementById('bk-list');
  if(!bookmarks.length) {
    el.innerHTML = '<div class="bk-empty">No bookmarks yet.<br>Tap the bookmark button to save the current page.</div>';
    return;
  }
  el.innerHTML = bookmarks.map((b,i) => `
    <div class="bk-item">
      <div class="bk-icon">🔖</div>
      <div class="bk-body" onclick="goTo(${b.pg});closePanel('pbk')">
        <div class="bk-name">${b.name}</div>
        <div class="bk-date">${b.juz}  ·  ${new Date(b.date).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}</div>
      </div>
      <div class="bk-del" onclick="deleteBk(${i},event)">✕</div>
    </div>`).join('');
}

function deleteBk(i, e) {
  e.stopPropagation();
  bookmarks.splice(i, 1);
  localStorage.setItem('qtbk', JSON.stringify(bookmarks));
  renderBookmarks();
  showToast('Bookmark removed');
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

// ═══════════════════════════════════════════
// KEYBOARD
// ═══════════════════════════════════════════
document.addEventListener('keydown', e => {
  if(e.key === 'ArrowRight') loadPage(curPage - 1); // RTL: right = prev
  if(e.key === 'ArrowLeft')  loadPage(curPage + 1); // RTL: left = next
  if(e.key === 'ArrowUp')    loadPage(curPage - 1);
  if(e.key === 'ArrowDown')  loadPage(curPage + 1);
});

// ═══════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════
function init() {
  buildSurahList();
  buildJuzList();
  loadPage(curPage);
}

window.addEventListener('load', init);
</script>
</body>
</html>
